# sis-05/submission.yml — your declaration for this SIS.
#
# Facts only. Every explanation goes in report.md; nothing here repeats prose.
# Fill every value. Check it before you push:
#
#     python tests/validate_submission.py
#
# The validator checks shape, never quality. A green run is the floor, not the grade.
# If you cannot run Python, fill the file by hand against the comments — a malformed
# file costs you nothing if the content is there.

schema: 1
assignment: "sis-05"            # do not edit

student:
  name: "Ali Akhmetov"   # as in the university register
  student_id: "25B032081"   # e.g. 00X000000
  group: "monday 16:00-19:00"   # your group code, as in the timetable
  github: aliakhmetov01   # username only, not a URL

assistant:
  tool: Claude Code   # the assistant you worked with, e.g. ChatGPT (web), Claude Code, Bolt.new
  model: claude-opus-5-5   # exactly as in report.md section 1, or: not displayed

project:                        # exactly as in report.md section 1
  name: "Smart Campus Room Availability"   # the project's name
  language: typescript   # its main language, e.g. python, typescript, java, go
  origin: smart-campus   # own | smart-campus | other
  baseline_commit: 2e65e6a   # the commit that brought the project in unchanged

counts:                         # the checker prints these under --json "measured"
  findings: 10   # complete rows in report.md 5.2
  risks: 7   # rows in the register, 6.1
  risks_confirmed: 6   # of those, how many are confirmed
  exchanges: 3   # complete exchanges in report.md section 11

decision:
  pattern: applied   # applied | not-warranted   from report.md 4.3
  level: 2   # 0 | 1 | 2 | 3   from report.md 7.2
  top_two: [R1, R2]   # the IDs from 6.2, highest first, e.g. [R1, R3]
  mitigated: [R1, R2]   # the two IDs of 8.1 and 8.2, e.g. [R1, R3]
  release: conditional   # go | conditional | no-go

checker:                        # from your LAST run of python tests/check_sis.py
  pass: 23
  fail: 0
  error: 0
  commit: 6939545   # the commit you ran it at: git rev-parse --short HEAD
                                # (normally the commit just before you commit this file — that is fine)
  known_fails: []   # every check still FAIL or ERROR, as in report.md 11.4, e.g. [P6]

review_findings:
  # Three or more. One line each, and each one names what it is about: a risk ID (R1...),
  # an acceptance criterion (AC1-AC5), a readiness row (1a-3d), or a file.
  # Worthless:        "The AI found some risks that were not real"
  # Worth everything: "R1: splitter.py line 16 evals the shares field; test_R1 failed before the fix - confirmed"
  - "R1: project/ had no .gitignore; git check-ignore exit 1 and git status listed node_modules/ and dist/; R1 tests failed 4/5 before 903a603 - confirmed"
  - "R2: src/form.ts toAttendees turned -5 into a filter, browser showed Rooms (5 of 5); R2 test failed (expected -5 to be null) before 9589cf2 - confirmed"
  - "R3: reviewer only inferred old vite/esbuild advisories; npm audit showed 6 vulnerabilities (2 critical, tinypool) - confirmed, left open"
  - "src/time.ts (R6): reviewer said '11:00:30' gives a wrong number; probe returned 660 (correct); NaN path not reproduced in a browser - plausible"
  - "evidence/before-attendees-minus5.jpg: reviewer feared personal data; the image shows only the fictional page - unsupported"

honesty:
  baseline_unchanged: yes   # yes | no   project/ at the baseline commit is the project as it was
  review_was_read_only: yes   # yes | no   the Task 4 review modified nothing
  runs_unedited: yes   # yes | no   every output in report.md is pasted from a real run
  no_secrets_or_personal_data: yes   # yes | no   nothing real in sis-05/
  ai_usage_disclosed: yes   # yes | no   AI_USAGE.md and section 11 are complete
