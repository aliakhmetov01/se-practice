# week-03/submission.yml — your declaration for this lab.
#
# Facts only. Every explanation goes in lab-report.md; nothing here repeats prose.
# Fill every value. Check it before you push:
#
#     python tests/validate_submission.py
#
# The validator checks shape, never quality. A green run is the floor, not the grade.
# If you cannot run Python, fill the file by hand against the comments — a malformed
# file costs you nothing if the content is there.

schema: 1
week: "03"

student:
  name: Ali Akhmetov
  student_id: 25B032081         # as in KBTU records, e.g. 24B031016
  github: aliakhmetov01             # your GitHub username, the one that owns the repo

assistant:
  tool: Gemini               # e.g. ChatGPT, Claude, Gemini, Copilot
  model: Gemini 3.8 Flash              # the exact model name with its version. "ChatGPT" is not a model name.

counts:
  user_stories: 6           # how many stories you kept after your review (the task asks for 6-8)
  acceptance_criteria_sets: 3   # how many stories you wrote Given/When/Then criteria for

checker:
  # Numbers from YOUR last run of: python tests/check_requirements.py
  # They must add up to the number of checks it runs. Report them as they came out.
  # A FAIL you report and explain in lab-report.md costs you nothing. A hidden one costs the criterion.
  pass: 23
  fail: 0
  error: 0
  commit: b4fdbc2             # the commit you ran the checker at: git rev-parse --short HEAD
                       # (normally the commit just before you commit this file — that is fine)

assumptions:
  # The scenario does not settle these two. Decide, declare, and defend the decision in lab-report.md.
  # Either answer is acceptable. Not deciding is not.
  overlap_touching_bookings: allowed  # allowed | not-allowed   (a booking ending 14:00 and one starting 14:00)
  exactly_two_hours: allowed          # allowed | not-allowed   (a booking of exactly the maximum length)

traceability:
  # Use the IDs from requirements/traceability.md. Empty lists are allowed — if you claim full
  # coverage, the checker and I will test that claim.
  use_cases_not_covered: []    # e.g. [UC-05, UC-06]
  stories_not_traced: []       # e.g. [US-09]

review_findings:
  # Three or more. One line each, and each one names the ID it is about.
  # Worthless: "the AI made mistakes".
  # Worth everything: "UC-06 Send confirmation had no story behind it until I wrote US-07".
  - "US-07 was removed because it represented a boundary assumption about R3 rather than one of the six fixed system functions."
  - "AC-05 was rewritten because the generated criterion introduced maintenance details that are explicitly outside the scenario."
  - "UC-01 Administrator association was removed because the revised requirements do not justify Administrator triggering View availability."

honesty:
  can_explain_everything_submitted: yes  # yes | no   — "no" is an accepted answer, name the part in lab-report.md
  ai_usage_disclosed: yes                # yes | no   — AI_USAGE.md is required every week
